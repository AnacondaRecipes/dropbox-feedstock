{% set name = "dropbox" %}
{% set version = "12.2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}-sdk-python/archive/v{{ version }}.tar.gz
  sha256: 9434c49f14d9c5a302d6ea48d92ec603b541790c449de5b8e7a8bc3bb68d06bf

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - setuptools >=77
    - setuptools-scm >=8,<9
  run:
    - python
    - requests >=2.16.2
    - stone >=3.5.3,<4

test:
  source_files:
    - test
  imports:
    - dropbox
    - dropbox.auth
    - dropbox.base
    - dropbox.base_team
    - dropbox.common
    - dropbox.dropbox_client
    - dropbox.exceptions
    - dropbox.oauth
    - dropbox.session
  requires:
    - pytest
    - pip
    - mock
    - pytest-mock
  commands:
    - pip check
    - pytest test/unit/test_dropbox_unit.py

about:
  home: https://www.dropbox.com/developers
  summary: Official Dropbox API Client
  description: The Official Dropbox API V2 SDK for Python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/dropbox/dropbox-sdk-python
  doc_url: https://dropbox-sdk-python.readthedocs.io

extra:
  recipe-maintainers:
    - guillochon
    - BastianZim
  skip-lints:
    - reachable_url
